<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Prompts Manager</title>
  </head>
  <body>
    <div class="app">
      <button class="icon-button open-toggle" id="btn-open">
        <img src="./assets/open.svg" alt="Abrir menu" class="icon" />
      </button>

      <aside class="sidebar">
        <header class="sidebar-header">
          <img src="./assets/logo.svg" alt="logo" class="logo" />

          <button class="icon-button close-toggle" id="btn-collapse">
            <img src="./assets/collapse.svg" alt="Fechar menu" class="icon" />
          </button>
        </header>

        <div class="sidebar-content">
          <div class="search-container">
            <label class="search-input" for="search">
              <img src="./assets/search.svg" alt="Buscar" class="search-icon" />
              <input id="search" type="text" placeholder="Buscar prompts" />
            </label>

            <button id="btn-new" class="btn-new">+ Novo prompt</button>

            <div class="search-divider" aria-hidden="true"></div>
            <ul class="prompt-list" id="prompt-list">
              <li class="prompt-item" role="listitem">
                <div class="prompt-item-content">
                  <div class="prompt-item-text">
                    <div class="prompt-item-title">Título do prompt</div>
                  </div>
                  <button class="btn-icon" aria-label="Remover prompt">
                    <img
                      src="./assets/remove.svg"
                      alt="Remover"
                      class="icon icon-trash"
                    />
                  </button>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </aside>

      <main class="main">
        <header>
          <button id="btn-copy" class="btn-outline">
            <img src="./assets/copy.svg" alt="Copiar" class="icon" />
            <span>Copiar</span>
          </button>
          <button id="btn-save" class="btn-primary">Salvar</button>
        </header>
        <div
          data-placeholder="Título do prompt"
          class="editable-wrapper"
          id="title-wrapper"
        >
          <h1
            id="prompt-title"
            class="prompt-title"
            contenteditable="true"
          ></h1>
        </div>
        <div
          data-placeholder="Conteúdo do prompt..."
          class="editable-wrapper"
          id="content-wrapper"
        >
          <div
            id="prompt-content"
            class="prompt-content"
            contenteditable="true"
          ></div>
        </div>
      </main>
    </div>

    <script src="./scripts.js"></script>
  </body>
</html>
